<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      :root {
        --ground: #0b0906;
        --ink: #f4ead2;
        --gold-deep: #9c7426;
        --gold: #d4a944;
        --gold-light: #f7e3a1;
        --font-display: "Playfair Display", serif;
        --font-text: "EB Garamond", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
        color: var(--ink);
      }

      /* Sfondo: bagliore caldo che respira lentamente */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #glow {
        position: absolute;
        left: 90px;
        top: 300px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 169, 68, 0.28) 0%, rgba(212, 169, 68, 0.08) 45%, rgba(0, 0, 0, 0) 70%);
      }
      #floor {
        position: absolute;
        left: 0;
        top: 1180px;
        width: 1080px;
        height: 740px;
        background: linear-gradient(180deg, rgba(212, 169, 68, 0) 0%, rgba(212, 169, 68, 0.1) 60%, rgba(156, 116, 38, 0.18) 100%);
      }
      #ornament {
        position: absolute;
        left: 510px;
        top: 1420px;
        width: 60px;
        height: 60px;
        border: 2px solid rgba(212, 169, 68, 0.55);
        transform: rotate(45deg);
      }
      #frame {
        position: absolute;
        left: 60px;
        top: 200px;
        width: 960px;
        height: 1100px;
        border: 2px solid rgba(212, 169, 68, 0.45);
      }

      /* Le scene di testo stanno nella fascia sicura 168–1330 px */
      .scene {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 670px;
        text-align: center;
      }
      .gold-text {
        background: linear-gradient(110deg, var(--gold-deep) 0%, var(--gold) 35%, var(--gold-light) 47%, #fffaf0 50%, var(--gold-light) 53%, var(--gold) 65%, var(--gold-deep) 100%);
        background-size: 300% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .rule {
        width: 0;
        height: 2px;
        background: var(--gold);
      }

      #logo-word {
        font-size: 112px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1;
      }
      #logo-sub {
        font-family: var(--font-text);
        font-size: 40px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--gold-light);
        margin-top: 36px;
      }
      #logo-rule {
        margin-top: 40px;
      }

      .kicker {
        font-family: var(--font-text);
        font-size: 38px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 40px;
      }
      .line {
        font-size: 90px;
        font-weight: 400;
        font-style: italic;
        line-height: 1.12;
        max-width: 800px;
      }

      #cta-main {
        font-size: 112px;
        font-weight: 700;
        line-height: 1.05;
      }
      #cta-sub {
        font-family: var(--font-text);
        font-size: 48px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--ink);
        margin-top: 44px;
      }
      #cta-rule {
        margin-top: 48px;
      }
      #cta-brand {
        font-size: 44px;
        letter-spacing: 0.3em;
        margin-top: 48px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div id="glow"></div>
        <div id="frame"></div>
        <div id="floor"></div>
        <div id="ornament-wrap"><div id="ornament"></div></div>
      </div>

      <!-- 1. Logo con riflesso dorato -->
      <div id="intro" class="clip scene" data-start="0" data-duration="4" data-track-index="1">
        <div id="logo-word" class="gold-text">CORTEDORO</div>
        <div id="logo-rule" class="rule"></div>
        <div id="logo-sub">Benvenuti</div>
      </div>

      <!-- 2–4. Tre frasi -->
      <div id="s1" class="clip scene" data-start="4" data-duration="2.6" data-track-index="2">
        <div class="kicker">I</div>
        <div class="line">Dove ogni <span class="gold-text">dettaglio</span> conta</div>
      </div>
      <div id="s2" class="clip scene" data-start="6.6" data-duration="2.6" data-track-index="2">
        <div class="kicker">II</div>
        <div class="line">Fatto con <span class="gold-text">cura</span>, da sempre</div>
      </div>
      <div id="s3" class="clip scene" data-start="9.2" data-duration="2.6" data-track-index="2">
        <div class="kicker">III</div>
        <div class="line">Un'esperienza che vale <span class="gold-text">oro</span></div>
      </div>

      <!-- 5. CTA -->
      <div id="cta" class="clip scene" data-start="11.8" data-duration="3.2" data-track-index="3">
        <div id="cta-main" class="gold-text">Scopri di più</div>
        <div id="cta-sub">link in bio</div>
        <div id="cta-rule" class="rule"></div>
        <div id="cta-brand" class="gold-text">CORTEDORO</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const calm = "power3.out";

      // Sfondo: bagliore che respira, cornice che si disegna
      tl.fromTo("#glow", { scale: 0.85, opacity: 0.6 }, { scale: 1.12, opacity: 1, duration: 7.5, ease: "sine.inOut" }, 0);
      tl.to("#glow", { scale: 0.95, opacity: 0.75, duration: 7.4, ease: "sine.inOut" }, 7.5);
      tl.fromTo("#ornament-wrap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.8, ease: calm }, 0.6);
      tl.fromTo("#frame", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 1.6, ease: calm }, 0);

      // Logo: già visibile al frame 0 (copertina), poi il riflesso scorre
      tl.fromTo("#logo-word", { opacity: 0.8, y: 16, scale: 1.04 }, { opacity: 1, y: 0, scale: 1, duration: 1.4, ease: calm }, 0);
      tl.fromTo("#logo-word", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.2, ease: "power2.inOut" }, 0.5);
      tl.to("#logo-rule", { width: 520, duration: 1.1, ease: calm }, 1.1);
      tl.fromTo("#logo-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.9, ease: calm }, 1.6);
      tl.to(["#logo-word", "#logo-rule", "#logo-sub"], { opacity: 0, y: -20, duration: 0.5, ease: "power2.in", stagger: 0.05 }, 3.4);

      // Frasi: entrata morbida, riflesso sulla parola d'oro, uscita prima della fine del clip
      [["#s1", 4], ["#s2", 6.6], ["#s3", 9.2]].forEach(([id, t]) => {
        tl.fromTo(`${id} .kicker`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: calm }, t + 0.05);
        tl.fromTo(`${id} .line`, { opacity: 0, y: 40, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: calm }, t + 0.15);
        tl.fromTo(`${id} .gold-text`, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.4, ease: "power2.inOut" }, t + 0.7);
        tl.to([`${id} .kicker`, `${id} .line`], { opacity: 0, y: -24, duration: 0.45, ease: "power2.in" }, t + 2.05);
      });

      // CTA: resta a schermo fino all'ultimo frame
      tl.fromTo("#cta-main", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.8, ease: calm }, 11.85);
      tl.fromTo("#cta-main", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.3, ease: "power2.inOut" }, 12.3);
      tl.fromTo("#cta-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: calm }, 12.1);
      tl.to("#cta-rule", { width: 360, duration: 0.8, ease: calm }, 12.3);
      tl.fromTo("#cta-brand", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: calm }, 12.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
